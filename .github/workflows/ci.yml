name: CI Quality Check

on:
  push:
    branches: ["*"] # Runs on every branch you push
  pull_request:
    branches: ["master"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Check for Broken Links (Very helpful for documentation sites!)
      - name: Link Checker
        uses: lycheeverse/lychee-action@v1
        with:
          args: >
            --verbose
            --no-progress
            --exclude '(?i)mathworks\.com'
            --exclude 'file://.*'
            './**/*.html'
          fail: true

      # 2. Check Markdown Formatting
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v1
        with:
          globs: |
            **/*.md
            !**/out.md

      # 3. Test the Build (Simulates GitHub Pages deployment)
      - name: Test Build
        run: |
          echo "Running build simulation..."
          # If using Jekyll, uncomment the next line:
          # bundle exec jekyll build 
          # If it's just plain HTML/CSS, this step can just be a confirmation.
          echo "Build successful."

      # 4. Lighthouse accessibility/responsive checks (runs in GitHub Actions)
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install test tools
        run: |
          npm install -g http-server lighthouse

      - name: Start local server
        run: |
          npx http-server ./ -p 8080 &
          sleep 3

      - name: Run Lighthouse (mobile)
        run: |
          lighthouse http://localhost:8080/index.html --output=json --output-path=./lighthouse-mobile.json --emulated-form-factor=mobile --only-categories=performance,accessibility,seo --chrome-flags="--no-sandbox --headless=new --disable-gpu"

      - name: Run Lighthouse (desktop)
        run: |
          lighthouse http://localhost:8080/index.html --output=json --output-path=./lighthouse-desktop.json --emulated-form-factor=desktop --only-categories=performance,accessibility,seo --chrome-flags="--no-sandbox --headless=new --disable-gpu"

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: |
            ./lighthouse-mobile.json
            ./lighthouse-desktop.json
